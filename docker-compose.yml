version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: agevine-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: agevine
    ports:
      - "5432:5432"
    volumes:
      - agevine-db-data:/var/lib/postgresql/data

volumes:
  agevine-db-data:
